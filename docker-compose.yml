version: '3.8'

# Docker Compose para Prompts & Snippets Manager
# 
# Servicios:
# - app: Aplicación PHP-FPM con Laravel
# - web: Servidor web Nginx
# - db: Base de datos MySQL 8.0
# - redis: Caché y gestor de colas

services:
  # Aplicación Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prompts-manager-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - prompts-network
    environment:
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-prompts_manager}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

  # Servidor web Nginx
  web:
    image: nginx:alpine
    container_name: prompts-manager-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - prompts-network
    depends_on:
      - app

  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: prompts-manager-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-prompts_manager}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-prompts_user}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - prompts-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis para caché y colas
  redis:
    image: redis:alpine
    container_name: prompts-manager-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - prompts-network

  # Node para compilar assets (opcional, para desarrollo)
  node:
    image: node:18-alpine
    container_name: prompts-manager-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - prompts-network
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev

networks:
  prompts-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
