name: CI/CD Pipeline

# Workflow de integración continua para Prompts & Snippets Manager
# Ejecuta tests, linters y compila assets

on:
  push:
    branches: [ main, develop, feat/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: Tests and Build
    runs-on: ubuntu-latest

    # Servicios requeridos para testing
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: prompts_manager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, redis
          coverage: xdebug

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Copy .env file
        run: cp .env.example .env 2>/dev/null || true

      - name: Create .env if needed
        run: |
          if [ ! -f .env ]; then
            echo "APP_NAME='Prompts Manager'" > .env
            echo "APP_ENV=testing" >> .env
            echo "APP_KEY=" >> .env
            echo "APP_DEBUG=true" >> .env
            echo "DB_CONNECTION=mysql" >> .env
            echo "DB_HOST=127.0.0.1" >> .env
            echo "DB_PORT=3306" >> .env
            echo "DB_DATABASE=prompts_manager_test" >> .env
            echo "DB_USERNAME=root" >> .env
            echo "DB_PASSWORD=password" >> .env
            echo "CACHE_DRIVER=redis" >> .env
            echo "QUEUE_CONNECTION=sync" >> .env
            echo "SESSION_DRIVER=array" >> .env
            echo "REDIS_HOST=127.0.0.1" >> .env
          fi

      - name: Generate application key
        run: php artisan key:generate

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache || echo "No storage/bootstrap directories yet"

      - name: Run database migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: prompts_manager_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force --no-interaction || echo "Migrations not ready yet"

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: prompts_manager_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            php artisan test --parallel || vendor/bin/phpunit
          else
            echo "No test suite configured yet"
          fi

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Compile assets
        run: npm run build || echo "Build script not configured yet"

      - name: Check for compilation errors
        run: |
          if [ -d "public/build" ]; then
            echo "Assets compiled successfully"
            ls -la public/build
          else
            echo "No build output found"
          fi

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHP linting
        run: |
          if composer show | grep -q "phpstan/phpstan"; then
            vendor/bin/phpstan analyse || echo "PHPStan not configured"
          else
            echo "PHPStan not installed"
          fi

      - name: Check code style
        run: |
          if composer show | grep -q "laravel/pint"; then
            vendor/bin/pint --test || echo "Pint not configured"
          else
            echo "Laravel Pint not installed"
          fi
